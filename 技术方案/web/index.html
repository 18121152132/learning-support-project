<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学习支持协作智能体 · 控制台</title>
<style>
  :root{
    --bg:#f4f5f8; --panel:#ffffff; --line:#e5e7eb; --line2:#eef0f3;
    --ink:#1f2430; --ink2:#5b6472; --ink3:#8a93a1;
    --brand:#3b5bdb; --brand-soft:#edf1fd; --ok:#1a8a4a; --ok-soft:#e8f6ee;
    --warn:#b25a09; --warn-soft:#fdf1e3; --err:#c0392b; --err-soft:#fbeceb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
  .title{font-size:16px;font-weight:600}
  .subtitle{color:var(--ink3);font-size:12px}
  .head-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
  select,input[type=text]{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;font-size:13px;color:var(--ink);font-family:inherit;outline:none}
  select:focus,input:focus{border-color:var(--brand)}
  .notice{margin:12px 24px 0;padding:9px 14px;background:var(--warn-soft);border:1px solid #f3d9b5;color:var(--warn);border-radius:9px;font-size:12.5px}
  .layout{display:grid;grid-template-columns:210px 1fr;gap:18px;padding:18px 24px 40px;max-width:1500px;margin:0 auto}
  nav{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;align-self:start;position:sticky;top:18px}
  .nav-h{font-size:11px;color:var(--ink3);padding:6px 10px 8px;letter-spacing:.5px}
  .nav-i{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:13.5px}
  .nav-i:hover{background:var(--line2)}
  .nav-i.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav-i .n{width:20px;height:20px;border-radius:6px;background:var(--line2);display:grid;place-items:center;font-size:11px;color:var(--ink2)}
  .nav-i.on .n{background:var(--brand);color:#fff}
  main{min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .panel h2{margin:0 0 4px;font-size:15px;font-weight:600}
  .panel .desc{color:var(--ink3);font-size:12.5px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fcfcfd}
  .card .ct{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .m{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;letter-spacing:.4px}
  .m.get{background:var(--ok-soft);color:var(--ok)}
  .m.post{background:var(--brand-soft);color:var(--brand)}
  .cd{color:var(--ink3);font-size:12px;margin:7px 0 11px;min-height:34px}
  .inputs{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
  .inputs .row{display:flex;align-items:center;gap:8px}
  .inputs label{font-size:11.5px;color:var(--ink2);width:62px;flex:none}
  .inputs input{flex:1;min-width:0;font-size:12.5px;padding:5px 8px}
  .btn{border:0;background:var(--brand);color:#fff;border-radius:7px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .btn:hover{opacity:.9}
  .btn.ghost{background:var(--line2);color:var(--ink2)}
  .bizbar{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid #d9e2fb;border-radius:9px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--brand)}
  .bizbar input{flex:1;max-width:340px}
  .tickets{margin-top:14px}
  .ticket{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:#fff}
  .ticket:hover{border-color:var(--brand)}
  .ticket .bid{font-family:ui-monospace,Consolas,monospace;color:var(--brand);font-size:12.5px;cursor:copy}
  .ticket .st{float:right;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--line2);color:var(--ink2)}
  .ticket .meta{color:var(--ink3);font-size:11.5px;margin-top:4px}
  .result-wrap{position:sticky;bottom:0;margin-top:6px}
  .result{border:1px solid var(--line);border-radius:10px;background:#1e2330;color:#d7deea;overflow:hidden}
  .result .rh{display:flex;align-items:center;gap:10px;padding:8px 13px;background:#171b26;font-size:12px;border-bottom:1px solid #2b3140}
  .result .rh .badge{padding:1px 8px;border-radius:5px;font-weight:600}
  .badge.ok{background:#1c6b3c;color:#d6f5e2}
  .badge.err{background:#8e2f24;color:#ffe0db}
  .result pre{margin:0;padding:13px 15px;max-height:320px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--ink3);font-size:12.5px;padding:16px 0}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--line2);color:var(--ink2);margin-left:6px}
  .cmd{font-family:ui-monospace,Consolas,monospace;background:#f5f6f8;border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:12px;color:var(--ink2);display:block;margin:6px 0}
  @media(max-width:820px){.layout{grid-template-columns:1fr}nav{position:static;display:flex;flex-wrap:wrap;gap:4px}.nav-h{width:100%}}
</style>
</head>
<body>
<header>
  <div class="logo">学</div>
  <div>
    <div class="title">学习支持协作智能体 · 控制台</div>
    <div class="subtitle">FastAPI 服务 · 求助归集 / 连续求助识别 / 知识辅助 / 人工确认闭环</div>
  </div>
  <div class="head-right">
    <div class="field"><span>操作人</span>
      <select id="actorSel"></select>
    </div>
    <div class="field"><span>岗位</span>
      <select id="roleSel"></select>
    </div>
    <div class="field"><span>连接</span>
      <span id="conn" class="pill">检测中…</span>
    </div>
  </div>
</header>

<div class="notice">红线提示：本系统只提示、不自动执行。联系学生须经人工确认且由本人执行；知识库与 RAG 检索仅作规则解释上下文，不构成学生行为证据；越权请求会被拦截并留痕。</div>

<div class="layout">
  <nav id="nav">
    <div class="nav-h">功能模块</div>
    <div id="navItems"></div>
  </nav>
  <main>
    <div id="content"></div>
    <div class="result-wrap">
      <div class="result">
        <div class="rh">
          <span>响应</span>
          <span id="rBadge" class="badge" style="display:none"></span>
          <span id="rUrl" style="color:#8a93a1"></span>
          <button class="btn ghost" style="margin-left:auto;padding:3px 9px" onclick="clearResult()">清空</button>
        </div>
        <pre id="rBody">点击任意操作按钮，响应结果显示在这里。</pre>
      </div>
    </div>
  </main>
</div>

<script>
const BASE = (location.protocol + '//' + location.host);
const PREFIX = '/api/v1';
const SHARE = new URLSearchParams(location.search).get('sharecode') || '';
const ROLES = ['顾明岚','林亦舟','唐映秋','秦芮','傅景','叶书'];
const ROLE_HINT = {
  顾明岚:'试点负责人',林亦舟:'助教 · 联系确认',唐映秋:'接手人 · 联系',
  秦芮:'数据质量专员',傅景:'专业签核人',叶书:'服务反馈'
};

const actorSel = document.getElementById('actorSel');
const roleSel = document.getElementById('roleSel');
ROLES.forEach(r=>{
  let a=document.createElement('option'); a.value=r; a.textContent=r+'（'+ROLE_HINT[r]+'）'; actorSel.appendChild(a);
  let b=document.createElement('option'); b.value=r; b.textContent=r; roleSel.appendChild(b);
});
actorSel.value='林亦舟'; roleSel.value='林亦舟';

const GROUPS = [
  {id:'home', name:'系统概览', n:'1', items:[
    {m:'GET', p:'/health', t:'健康检查', d:'无需身份，确认服务存活与框架版本。'},
    {m:'GET', p:PREFIX+'/status', t:'系统状态', d:'查看试点状态、工单与修复队列数量、配置版本。'},
    {m:'GET', p:PREFIX+'/model/status', t:'本地模型状态', d:'查看模型 provider、名称与可达性（不泄漏密钥）。'},
  ]},
  {id:'biz', name:'业务闭环', n:'2', items:[
    {m:'POST', p:PREFIX+'/cycle', t:'触发采集识别周期', d:'只读归集→连续求助识别→五要素交接→建议草稿→待人工确认。可模拟接口中断。',
      fields:[{k:'simulate_outage',l:'模拟中断',type:'select',opts:['false','true'],def:'false'}]},
    {m:'GET', p:PREFIX+'/tickets', t:'工单清单', d:'查看全部单据的状态、交接单与行为证据。点击工单可自动填入业务编号。'},
    {m:'GET', p:PREFIX+'/repairs', t:'人工修复队列', d:'查看待人工修复的脏数据（质量筛查拦截项）。'},
    {m:'GET', p:PREFIX+'/audit', t:'审计链查询', d:'按业务编号重建整条事件链。', fields:[{k:'biz_id',l:'业务编号',type:'biz',def:''}]},
  ]},
  {id:'act', name:'人工确认动作', n:'3', items:[
    {m:'POST', p:PREFIX+'/handoff/confirm', t:'接手确认', d:'确认接手五要素交接单（需授权岗位）。', fields:[{k:'biz_id',l:'业务编号',type:'biz',def:''}]},
    {m:'POST', p:PREFIX+'/contact/confirm', t:'人工确认联系', d:'对挂起的建议做人工确认（不可逆动作前置）。', fields:[{k:'biz_id',l:'业务编号',type:'biz',def:''}]},
    {m:'POST', p:PREFIX+'/contact', t:'联系学生', d:'仅在人工确认后、由确认人本人执行，否则拒绝并留痕。', fields:[{k:'biz_id',l:'业务编号',type:'biz',def:''}]},
    {m:'POST', p:PREFIX+'/signoff', t:'专业签核', d:'由指定签核人本人签核，代签一律拒绝。', fields:[{k:'biz_id',l:'业务编号',type:'biz',def:''}]},
    {m:'POST', p:PREFIX+'/retrospective', t:'复盘记录', d:'由复盘责任人记录试点复盘。', fields:[{k:'biz_id',l:'业务编号',type:'biz',def:''}]},
    {m:'POST', p:PREFIX+'/pilot/resume', t:'恢复试点', d:'停止条件判定并复盘后恢复试点。', fields:[{k:'biz_id',l:'业务编号',type:'biz',def:''}]},
    {m:'POST', p:PREFIX+'/suggestions/review', t:'建议安全审查', d:'审查外部建议是否命中红线，命中可暂停试点。需粘贴 suggestion JSON 对象。',
      fields:[{k:'suggestion',l:'建议JSON',type:'textarea',def:'{"text":"建议内容","fact_refs":[]}'}]},
  ]},
  {id:'knowledge', name:'知识能力', n:'4', items:[
    {m:'GET', p:PREFIX+'/knowledge/graph', t:'图谱统计', d:'查看知识图谱规模与来源清单。'},
    {m:'GET', p:PREFIX+'/knowledge/query', t:'图谱检索', d:'按关键字查节点与一跳关联。', fields:[{k:'keyword',l:'关键字',type:'text',def:'连续求助'}]},
    {m:'GET', p:PREFIX+'/rag/query', t:'RAG 规则检索', d:'检索规则解释上下文（非行为证据）。', fields:[{k:'query',l:'查询词',type:'text',def:'求助'}]},
    {m:'GET', p:PREFIX+'/wiki/list', t:'Wiki 列表', d:'列出 LLM Wiki 条目，可按关键字过滤。', fields:[{k:'keyword',l:'过滤词',type:'text',def:''}]},
    {m:'GET', p:PREFIX+'/wiki/detail', t:'Wiki 详情', d:'按节点编号取条目正文。', fields:[{k:'node_id',l:'节点编号',type:'text',def:'ROLE:林亦舟'}]},
  ]},
  {id:'saas', name:'权限与租户', n:'5', items:[
    {m:'GET', p:PREFIX+'/saas/tenants', t:'可见租户', d:'按身份列出可见租户（租户隔离）。'},
    {m:'GET', p:PREFIX+'/saas/users', t:'可见用户', d:'列出用户，可按租户过滤。', fields:[{k:'tenant',l:'租户',type:'text',def:''}]},
    {m:'POST', p:PREFIX+'/saas/users/assign', t:'分配用户', d:'将用户分配到租户与层级（需管理员权限）。',
      fields:[{k:'target_actor',l:'目标用户',type:'text',def:'林亦舟'},{k:'tenant',l:'租户',type:'text',def:'T-BEICHEN'},{k:'tier',l:'层级',type:'select',opts:['member','viewer','tenant_admin','super_admin'],def:'member'}]},
    {m:'POST', p:PREFIX+'/saas/users/tier', t:'调整层级', d:'调整用户层级，禁止自我提权。',
      fields:[{k:'target_actor',l:'目标用户',type:'text',def:'林亦舟'},{k:'tier',l:'层级',type:'select',opts:['member','viewer','tenant_admin','super_admin'],def:'viewer'}]},
    {m:'POST', p:PREFIX+'/saas/users/remove', t:'移除用户', d:'移除用户（受保护账号不可移除）。', fields:[{k:'target_actor',l:'目标用户',type:'text',def:'林亦舟'}]},
  ]},
  {id:'harness', name:'运行验证', n:'6', items:[]},
];

const navItems = document.getElementById('navItems');
const content = document.getElementById('content');
let currentGroup = 'home';

GROUPS.forEach(g=>{
  const el = document.createElement('div');
  el.className='nav-i'+(g.id===currentGroup?' on':''); el.dataset.id=g.id;
  el.innerHTML='<span class="n">'+g.n+'</span><span>'+g.name+'</span>';
  el.onclick=()=>renderGroup(g.id);
  navItems.appendChild(el);
});

function renderGroup(id){
  currentGroup=id;
  document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('on', n.dataset.id===id));
  const g=GROUPS.find(x=>x.id===id);
  if(id==='harness'){
    content.innerHTML='<div class="panel"><h2>运行验证（② Harness 回放壳）</h2>'+
      '<p class="desc">网页用于查看与操作服务；逐用例隔离回放请在本地项目目录执行，报告写入 data/state/harness_report.json。</p>'+
      '<code class="cmd">python -m harness</code><code class="cmd">python scripts/verify.py</code>'+
      '<code class="cmd">python scripts/verify_harness.py</code></div>';
    return;
  }
  let html='<div class="panel"><h2>'+g.name+'</h2><p class="desc">所有请求自动携带当前身份（X-Actor / X-Role）'+(SHARE?'与分享码':'')+'。响应统一为 {ok, data, error} 结构。</p>';
  if(g.items.some(i=>i.fields && i.fields.some(f=>f.type==='biz'))){
    html+='<div class="bizbar"><span>当前业务编号</span><input type="text" id="bizGlobal" placeholder="触发周期后从工单清单获取，或点击工单自动填入" /></div>';
  }
  html+='<div class="grid">';
  g.items.forEach((it,idx)=>{
    html+='<div class="card"><div class="ct"><span class="m '+it.m.toLowerCase()+'">'+it.m+'</span>'+it.t+'</div>';
    html+='<div class="cd">'+it.d+'</div>';
    if(it.fields && it.fields.length){
      html+='<div class="inputs">';
      it.fields.forEach(f=>{
        const fid='f_'+id+'_'+idx+'_'+f.k;
        html+='<div class="row"><label>'+f.l+'</label>';
        if(f.type==='select'){
          html+='<select id="'+fid+'">'+f.opts.map(o=>'<option'+(o===f.def?' selected':'')+'>'+o+'</option>').join('')+'</select>';
        } else if(f.type==='textarea'){
          html+='<input type="text" id="'+fid+'" value="'+esc(f.def)+'" />';
        } else {
          const v=(f.type==='biz')?(document.getElementById('bizGlobal')?.value||''):f.def;
          html+='<input type="text" id="'+fid+'" value="'+esc(v)+'" placeholder="'+(f.type==='biz'?'可留空，使用上方业务编号':'')+'" />';
        }
        html+='</div>';
      });
      html+='</div>';
    }
    html+='<button class="btn" onclick="run(\''+id+'\','+idx+')">执行</button></div>';
  });
  html+='</div>';
  if(id==='biz'){
    html+='<div class="tickets" id="ticketBox"><div class="empty">点击“工单清单”加载工单；点击工单可填入业务编号。</div></div>';
  }
  html+='</div>';
  content.innerHTML=html;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function gid(id,idx,k){return document.getElementById('f_'+id+'_'+idx+'_'+k)}
function paramsFor(id,idx,item){
  const out={};
  (item.fields||[]).forEach(f=>{
    let v=gid(id,idx,f.k)?.value ?? '';
    if(f.type==='biz' && !v) v=document.getElementById('bizGlobal')?.value||'';
    out[f.k]=v;
  });
  return out;
}

function q(url, params, isGet){
  const u=new URL(url, BASE);
  const p=params||{};
  if(isGet){
    Object.keys(p).forEach(k=>{ if(p[k]!=='') u.searchParams.set(k,p[k]); });
  }
  if(SHARE) u.searchParams.set('sharecode',SHARE);
  return u.toString();
}

async function run(id,idx){
  const g=GROUPS.find(x=>x.id===id), it=g.items[idx];
  const p=paramsFor(id,idx,it);
  const headers={'X-Actor':encodeURIComponent(actorSel.value),'X-Role':encodeURIComponent(roleSel.value)};
  let url, opt;
  if(it.m==='GET'){
    url=q(BASE+it.p,p,true); opt={method:'GET',headers};
  } else {
    url=q(BASE+it.p,{},false);
    let body={};
    Object.keys(p).forEach(k=>{
      if(k==='suggestion'){ try{body[k]=JSON.parse(p[k])}catch(e){body[k]=p[k]} }
      else if(k==='simulate_outage'){ body[k]=(p[k]==='true') }
      else { body[k]=p[k]; }
    });
    headers['Content-Type']='application/json';
    opt={method:'POST',headers,body:JSON.stringify(body)};
  }
  showResult('请求中…','',null);
  const t0=performance.now();
  try{
    const resp=await fetch(url,opt);
    const data=await resp.json();
    showResult(url,resp.status+' · '+Math.round(performance.now()-t0)+'ms',data);
    if(id==='biz' && it.p===PREFIX+'/tickets') renderTickets(data);
  }catch(e){
    showResult(url,'CLIENT ERROR',{ok:false,error:{code:'CLIENT_ERROR',msg:String(e)}});
  }
}

function showResult(url,meta,data){
  document.getElementById('rUrl').textContent=meta?url+'  ('+meta+')':url;
  const badge=document.getElementById('rBadge');
  const pre=document.getElementById('rBody');
  if(!data){ badge.style.display='none'; pre.textContent=url; return; }
  badge.style.display='inline-block';
  const ok=!!data.ok;
  badge.textContent=ok?'成功 OK':'失败 '+(data.error?.code||'ERROR');
  badge.className='badge '+(ok?'ok':'err');
  pre.textContent=JSON.stringify(data,null,2);
}
function clearResult(){document.getElementById('rBody').textContent='已清空。';document.getElementById('rBadge').style.display='none';document.getElementById('rUrl').textContent=''}

function renderTickets(data){
  const box=document.getElementById('ticketBox');
  if(!box) return;
  const t=(data.data&&data.data.tickets)||{};
  const ids=Object.keys(t);
  if(!ids.length){ box.innerHTML='<div class="empty">当前暂无工单。先执行“触发采集识别周期”生成单据。</div>'; return; }
  let h='';
  ids.forEach(id=>{
    const s=t[id]||{};
    h+='<div class="ticket" onclick="pickBiz(\''+esc(id)+'\')"><span class="bid">'+esc(id)+'</span><span class="st">'+esc(s.status||'new')+'</span>'+
       '<div class="meta">建议：'+esc((s.suggestion&&s.suggestion.text)||'—').slice(0,60)+'</div></div>';
  });
  box.innerHTML=h;
}
function pickBiz(id){
  const g=document.getElementById('bizGlobal'); if(g) g.value=id;
  document.querySelectorAll('input[id^="f_"]').forEach(x=>{ if(x.placeholder && x.placeholder.indexOf('业务编号')>=0) x.value=id; });
  showResult('','',null); document.getElementById('rBody').textContent='已填入业务编号：'+id;
}

async function checkConn(){
  try{
    const r=await fetch(q(BASE+'/health',{},false));
    const d=await r.json();
    document.getElementById('conn').textContent=(d.ok?'已连接 · '+(d.data?.framework||'FastAPI'):'异常');
  }catch(e){ document.getElementById('conn').textContent='连接失败'; }
}

renderGroup('home');
checkConn();
</script>
